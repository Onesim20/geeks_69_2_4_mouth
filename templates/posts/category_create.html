{% extends 'base.html' %}

{% block title %}Новая категория{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h1 class="fw-bold mb-4">Новая категория</h1>

        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label for="{{ form.title.id_for_label }}" class="form-label fw-bold">{{ form.title.label }}</label>
                {{ form.title }}
                {% for error in form.title.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                {% endfor %}
            </div>

            <button type="submit" class="btn btn-primary">Создать</button>
            <a href="{% url 'create_post' %}" class="btn btn-secondary">К созданию поста</a>
        </form>
    </div>
</div>
{% endblock %}
